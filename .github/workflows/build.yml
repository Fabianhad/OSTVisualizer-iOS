name: Build IPA

# Builds the iOS app with standard tools (XcodeGen + xcodebuild) on a macOS runner and produces a
# FAKE-SIGNED IPA (no Apple account, certificate, provisioning profile or secret is used).
# See BUILD.md. The Nyxian path (Config/Project.plist) and the two older workflows are untouched.

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ---- bgfx / bx / bimg pin: the single place to edit when bumping bgfx (see BUILD.md) ----
  # These are the commits the headers committed under Libs/bgfx were taken from (git-blob-identical).
  BGFX_SHA: 8532b2c45d2f4332a9ac9734b85c2ea2253cb8d5
  BX_SHA: cac72f6cfa0893393ea12692ebfacb4495f8c826
  BIMG_SHA: 9114b47f532ce59cd0c6c9f8932df2c48888d4c1
  # Bump to force a rebuild of the cached libraries when the build recipe or the toolchain below changes.
  BGFX_RECIPE_VERSION: "1"
  # ---- toolchain: the same one that built the libraries first used by this project (Xcode 16.4,
  # iPhoneOS 18.5 SDK, Apple clang 17). Keep runs-on and XCODE_APP in step. ----
  XCODE_APP: /Applications/Xcode_16.4.app
  # ---- outputs ----
  ENTITLEMENTS_FILE: Config/Entitlements.fakesign.plist
  # Any entitlement key matching this (case-insensitive, extended regex) is a memory entitlement and fails the build:
  # com.apple.developer.kernel.increased-memory-limit, ...increased-debugging-memory-limit,
  # com.apple.developer.kernel.extended-virtual-addressing, com.apple.private.memorystatus..., jetsam keys.
  MEMORY_ENTITLEMENT_REGEX: 'memory|jetsam|extended-virtual-addressing'
  IPA_NAME: OST-Visualizer.ipa
  # Kept stable between builds so iRAM+ keeps recognising the installed app. The build fails if they change.
  EXPECTED_BUNDLE_ID: com.fabian.ostvisualizer
  EXPECTED_EXECUTABLE: OST Visualizer
  EXPECTED_MIN_OS: "14.8"
  BGFX_LIB_DIR: Libs/bgfx/bgfx/.build/ios-arm64/bin
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

defaults:
  run:
    shell: bash

jobs:
  build-ipa:
    # macos-15, not macos-latest: macos-latest moves to a newer Xcode, and the bgfx makefiles generated by
    # bx/genie hard-code clang flags (-fembed-bitcode, --sysroot=...iPhoneOS8.0.sdk) that were only
    # verified with Xcode 16.4.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode and show the toolchain
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not installed on this runner image. Installed:"
            ls -d /Applications/Xcode*
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-path) ($(xcrun --sdk iphoneos --show-sdk-version))"
          xcrun clang --version
          # The bgfx makefiles hard-code /Applications/Xcode.app/.../clang.
          HARDCODED="/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/clang"
          test -x "$HARDCODED"
          if [ "$(cd /Applications/Xcode.app && pwd -P)" != "$(cd "$XCODE_APP" && pwd -P)" ]; then
            echo "::warning::/Applications/Xcode.app is not $XCODE_APP: bgfx would be compiled by a different clang than the SDK in use."
          fi

      - name: Install XcodeGen and ldid
        run: |
          set -euo pipefail
          brew install xcodegen ldid
          xcodegen --version
          command -v ldid

      - name: Show cmake version
        run: |
          set -euo pipefail
          cmake --version

      # Unit tests first: a failing test stops the job before any library or app build.
      - name: Unit tests (host build)
        run: |
          set -euo pipefail
          cmake -S Config/Tests -B build/tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tests --parallel
          ctest --test-dir build/tests --output-on-failure --no-tests=error

      - name: Verify libmanifold.a is arm64
        run: |
          set -euo pipefail
          LIB=Libs/Manifold/lib/libmanifold.a
          test -s "$LIB"
          lipo -info "$LIB"
          ARCHS="$(lipo -archs "$LIB")"
          if [ "$ARCHS" != "arm64" ]; then
            echo "::error::$LIB must contain arm64 only, found: $ARCHS"
            exit 1
          fi
          otool -l "$LIB" 2>/dev/null | grep -m1 -A4 LC_BUILD_VERSION || true

      - name: Validate plists
        run: |
          set -euo pipefail
          plutil -lint Config/Info.plist "$ENTITLEMENTS_FILE"

      # ---- bgfx, bx and bimg static libraries (not tracked in git) ----
      - name: Restore bgfx libraries from cache
        id: bgfx_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BGFX_LIB_DIR }}
          key: bgfx-ios-arm64-${{ runner.os }}-${{ runner.arch }}-${{ env.BGFX_SHA }}-${{ env.BX_SHA }}-${{ env.BIMG_SHA }}-r${{ env.BGFX_RECIPE_VERSION }}

      # bx and bimg must sit next to bgfx: the bgfx makefile expects ../bx and ../bimg.
      - name: Checkout bgfx (pinned)
        if: steps.bgfx_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bgfx
          ref: ${{ env.BGFX_SHA }}
          path: deps/bgfx
          persist-credentials: false

      - name: Checkout bx (pinned)
        if: steps.bgfx_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bx
          ref: ${{ env.BX_SHA }}
          path: deps/bx
          persist-credentials: false

      - name: Checkout bimg (pinned)
        if: steps.bgfx_cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: bkaradzic/bimg
          ref: ${{ env.BIMG_SHA }}
          path: deps/bimg
          persist-credentials: false

      - name: Build bgfx libraries (ios-arm64 release)
        if: steps.bgfx_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The generated makefiles point --sysroot at a non-existent iPhoneOS8.0.sdk; the real SDK comes from
          # SDKROOT, so it must be exported in the same step as make.
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export SDKROOT
          echo "SDKROOT=$SDKROOT"
          make -j"$(sysctl -n hw.ncpu)" -C deps/bgfx ios-arm64-release
          ls -l deps/bgfx/.build/ios-arm64/bin

      - name: Install bgfx libraries into Libs
        if: steps.bgfx_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$BGFX_LIB_DIR"
          for lib in libbgfxRelease libbxRelease libbimgRelease libbimg_decodeRelease; do
            cp "deps/bgfx/.build/ios-arm64/bin/$lib.a" "$BGFX_LIB_DIR/"
          done

      - name: Verify bgfx libraries
        run: |
          set -euo pipefail
          for lib in libbgfxRelease libbxRelease libbimgRelease libbimg_decodeRelease; do
            f="$BGFX_LIB_DIR/$lib.a"
            test -s "$f"
            ARCHS="$(lipo -archs "$f")"
            if [ "$ARCHS" != "arm64" ]; then
              echo "::error::$f must contain arm64 only, found: $ARCHS"
              exit 1
            fi
            echo "$f: $ARCHS"
          done
          # Informational: platform and minimum iOS the bgfx objects were built for.
          otool -l "$BGFX_LIB_DIR/libbgfxRelease.a" 2>/dev/null | grep -m1 -A4 LC_BUILD_VERSION || true

      # Saved only after the verification above (a wrong-architecture build must never be cached), and before the app
      # build, so a later failure does not throw the libraries away.
      - name: Save bgfx libraries to cache
        if: steps.bgfx_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BGFX_LIB_DIR }}
          key: ${{ steps.bgfx_cache.outputs.cache-primary-key }}

      # ---- app ----
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d OSTVisualizer.xcodeproj
          xcodebuild -list -project OSTVisualizer.xcodeproj

      - name: Build app (Release, iphoneos, unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project OSTVisualizer.xcodeproj \
            -scheme OSTVisualizer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

      - name: Locate and check the app bundle
        run: |
          set -euo pipefail
          PRODUCTS="build/DerivedData/Build/Products/Release-iphoneos"
          COUNT="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -type d | wc -l | tr -d ' ')"
          if [ "$COUNT" != "1" ]; then
            echo "::error::expected exactly one .app in $PRODUCTS, found $COUNT"
            ls -la "$PRODUCTS"
            exit 1
          fi
          APP="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -type d)"
          PLIST="$APP/Info.plist"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          BID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          MINOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")"
          echo "app:        $APP"
          echo "executable: $EXE"
          echo "bundle id:  $BID"
          echo "min iOS:    $MINOS"
          if [ "$EXE" != "$EXPECTED_EXECUTABLE" ] || [ "$BID" != "$EXPECTED_BUNDLE_ID" ] || [ "$MINOS" != "$EXPECTED_MIN_OS" ]; then
            echo "::error::executable, bundle id or minimum iOS changed (expected $EXPECTED_EXECUTABLE / $EXPECTED_BUNDLE_ID / $EXPECTED_MIN_OS)"
            exit 1
          fi
          test -f "$APP/$EXE"
          ARCHS="$(lipo -archs "$APP/$EXE")"
          if [ "$ARCHS" != "arm64" ]; then
            echo "::error::executable must be arm64 only, found: $ARCHS"
            exit 1
          fi
          # The app ships no resources: the *.sc shader sources must never end up in the bundle.
          # (Command substitution, not "find | grep -q": with pipefail a SIGPIPE from the early-exiting grep would hide a match.)
          SC_FILES="$(find "$APP" -name '*.sc')"
          if [ -n "$SC_FILES" ]; then
            echo "::error::shader sources (*.sc) found in the app bundle: $SC_FILES"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "APP_EXE=$EXE" >> "$GITHUB_ENV"

      - name: Fake-sign with ldid
        run: |
          set -euo pipefail
          # plutil validates the file and drops its XML comments before ldid reads it.
          mkdir -p build
          plutil -convert xml1 -o build/entitlements.xml "$ENTITLEMENTS_FILE"
          # Fail before signing if the entitlements file asks for a memory entitlement (iRAM+ applies those after install).
          # (plutil -p prints only the keys and values, so comments in the source file cannot trigger a false match.)
          ENT_KEYS="$(plutil -p build/entitlements.xml)"
          if grep -Eqi "$MEMORY_ENTITLEMENT_REGEX" <<<"$ENT_KEYS"; then
            echo "::error::$ENTITLEMENTS_FILE contains a memory entitlement (matches '$MEMORY_ENTITLEMENT_REGEX'); remove it, iRAM+ applies those after installation"
            exit 1
          fi
          ldid -S"build/entitlements.xml" "$APP_PATH/$APP_EXE"

      - name: Verify entitlements
        run: |
          set -euo pipefail
          ENT="$(ldid -e "$APP_PATH/$APP_EXE")"
          echo "$ENT"
          if [ -z "$ENT" ]; then
            echo "::error::no entitlements embedded in the signed executable"
            exit 1
          fi
          # Memory entitlements are applied after installation with iRAM+; they must never be part of the build.
          # Checked on the keys of the embedded plist (plutil -p), not on the raw text, so a comment cannot cause a false match.
          printf '%s\n' "$ENT" > build/embedded-entitlements.plist
          EMBEDDED_KEYS="$(plutil -p build/embedded-entitlements.plist)"
          echo "embedded entitlements (plutil -p):"
          echo "$EMBEDDED_KEYS"
          if grep -Eqi "$MEMORY_ENTITLEMENT_REGEX" <<<"$EMBEDDED_KEYS"; then
            echo "::error::memory entitlement (matches '$MEMORY_ENTITLEMENT_REGEX') found in the signed binary; remove it from $ENTITLEMENTS_FILE"
            exit 1
          fi
          test "$(lipo -archs "$APP_PATH/$APP_EXE")" = "arm64"

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/ipa "build/$IPA_NAME"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && zip -qry "../$IPA_NAME" Payload)
          unzip -l "build/$IPA_NAME" > build/ipa-listing.txt
          head -n 12 build/ipa-listing.txt
          if ! grep -Fq "Payload/$(basename "$APP_PATH")/$APP_EXE" build/ipa-listing.txt; then
            echo "::error::executable missing from the IPA"
            exit 1
          fi
          ls -l "build/$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OST-Visualizer-ipa
          path: build/${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

      - name: Upload xcodebuild log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
